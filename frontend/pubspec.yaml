name: frontend
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API
  dio: ^5.9.0

  # 상태관리
  provider: ^6.1.5

  # 환경변수
  flutter_dotenv: ^5.2.1

  # 캘린더
  table_calendar: ^3.2.0

  # 위치
  geolocator: ^14.0.2
  google_maps_flutter: ^2.12.3

  # 권한
  permission_handler: ^12.0.1

  # 음성 (STT / TTS)
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

  # 웨이크워드("포비") + 명령 — 온디바이스 오픈소스 STT(Vosk, 한국어 모델)
  # pub 버전은 AGP 9 와 안 맞아(namespace/compileSdk 낡음) 로컬로 vendor 후 gradle 수정함.
  vosk_flutter_2:
    path: plugins/vosk_flutter_2
  # 화면 꺼진 상태 상시 대기용 포그라운드 서비스
  flutter_foreground_task: ^9.2.2

  # 알림
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # 로컬 알림 (자동 브리핑 — 설정 시각에 전화형 알림 화면을 띄운다)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # 로컬 저장
  shared_preferences: ^2.5.3

  # 이미지
  image_picker: ^1.2.0

# vosk_flutter_2 가 permission_handler ^11 을 요구하지만, 이 앱은 ^12 를 쓰므로
# 12로 강제한다(권한 Dart API 는 11↔12 동일하여 실사용 문제 없음).
dependency_overrides:
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Vosk 한국어 모델(zip)을 이 폴더에 넣으세요. (README.txt 참고)
    - assets/models/
