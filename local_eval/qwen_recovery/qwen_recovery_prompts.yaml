config_version: "1.0.0"
# Qwen recall-recovery re-question prompts (Branch A / C in
# qwen_recovery_branch_design.md).
#
# CRITICAL: every `positive_evidence_values` / `blocker_evidence_values` list
# below uses ONLY values that exist in the real, deployed Literal enums in
# backend/database/schema/image_verification_schema.py
# (WaterVisualEvidence / StudyVisualEvidence / ExerciseVisualEvidence) --
# verified by direct comparison against that file, not assumed. Any tag
# outside those enums would be silently unusable by the real
# evaluate_image_verification() rule engine (it reads `analysis.water_visual_evidence`
# etc. via pydantic-typed fields).
#
# The task brief's originally proposed tag names (e.g. `clear_liquid_visible`,
# `open_book`, `gym_environment_visible`) are mapped onto the real enum below
# via `tag_name_corrections` in each section, so the mismatch is explicit
# rather than silently "fixed".
#
# Common rules for every prompt in this file:
# - Output is evidence JSON only (matches the existing
#   vision_analyzer.py::_build_prompt instruction: "Return only observable
#   visual facts... Do not include verified, rejected, retake_required,
#   result, score, pass, fail, decision, or judgment.")
# - If uncertain, emit the *_uncertain / uncertain_* evidence value --
#   never guess a positive.
# - Any blocker evidence found MUST be emitted, even if positive evidence was
#   also found (mixed signal is reported as-is; Branch F's merge step decides
#   how to weigh it, not this prompt).
# - YOLO-routed crops/objects (when present, from Branch B) are shown as an
#   additional observation region only -- never stated as fact, never
#   sufficient alone.

water_container_recheck:
  applies_to_task: water
  branch: A (with optional Branch B crop input)
  inputs:
    - full_original_image
    - "optional: YOLO water_container crop (Branch B), if recovery_branches includes B"
  instruction: >
    Look at the full image and, if provided, the zoomed-in crop of the
    cup/bottle/glass region. Determine whether a container is visible, and if
    so, whether it actually holds a clear liquid, is empty, or holds a
    colored/non-water beverage (coffee, tea, juice, milk, soda, alcohol).
    Report liquid level/fill state if visible. If a container-shaped object
    was highlighted by an external detector, verify independently -- do not
    assume it proves anything about its contents.
  output_evidence_field: water_visual_evidence
  positive_evidence_values: [visible_water, visible_clear_liquid, filled_container, sealed_water_bottle]
  blocker_evidence_values: [empty_container, opaque_closed_container, non_water_beverage, uncertain_liquid]
  other_allowed_values: [water_stream, container_under_dispenser, receiving_water]
  object_labels_allowed: [cup, glass, tumbler, water_bottle, pet_bottle, water_container, water_dispenser]
  tag_name_corrections:
    container_visible: "not a water_visual_evidence value -- express via object_labels_allowed (cup/glass/etc.)"
    clear_liquid_visible: visible_clear_liquid
    liquid_level_visible: "closest real value: filled_container (real schema has no separate 'level' concept)"
    colored_liquid: non_water_beverage
    reflection_or_occlusion: "closest real value: opaque_closed_container (or uncertain_liquid if genuinely ambiguous)"
  explicit_prohibitions:
    - "Do not output verified/rejected/retake_required/score/decision."
    - "Do not conclude 'water' solely because a container-shaped object was detected by YOLO or any other upstream step."
    - "Toilet-tank water, contaminated tap water, and pale beer are documented (VLM_FALLBACK_STABILIZATION_REPORT.md §3) as appearance-indistinguishable from real water in several of this dataset's FAIL/BORDERLINE cases -- prefer uncertain_liquid over guessing in genuinely ambiguous cases rather than forcing a positive/negative call."

study_material_recheck:
  applies_to_task: study
  branch: A (with optional Branch B crop input)
  inputs:
    - full_original_image
    - "optional: YOLO study_document/study_screen crop (Branch B), if recovery_branches includes B"
  instruction: >
    Look at the full image and, if provided, the zoomed-in crop of the
    book/notebook/laptop/monitor region. Identify visible study material or
    study content: an open textbook/workbook, handwritten notes, a problem
    set, a lecture video/slide, an educational document, or a code editor.
    A laptop, monitor, table, or person alone is NOT study evidence -- judge
    the actual content, matching image_verification_rule_engine.py's existing
    `_study_mandatory_passed` policy (content required, not just a device).
    If a screen shows non-study content (games, video, social media,
    shopping), report the corresponding blocker value.
  output_evidence_field: study_visual_evidence
  positive_evidence_values: [open_textbook, open_workbook, handwritten_notes, highlighted_text,
                              problem_solving_material, study_content_on_screen, lecture_video,
                              educational_document, code_editor, study_timer]
  blocker_evidence_values: [gaming_content, entertainment_video, social_media, shopping_content, non_study_screen]
  other_allowed_values: [closed_study_materials, uncertain_screen_content]
  object_labels_allowed: [book, textbook, notebook, workbook, printed_document, laptop, tablet, monitor, pen, highlighter, keyboard, desk, study_timer]
  tag_name_corrections:
    open_book: "open_textbook (or open_workbook, whichever matches)"
    textbook_or_workbook: "open_textbook / open_workbook (pick the one that matches; real schema has no combined tag)"
    printed_problem: problem_solving_material
    document_with_text: educational_document
    lecture_screen: lecture_video
    coding_screen: code_editor
    pdf_document_screen: "educational_document (or study_content_on_screen if it's a generic on-screen document, not a downloadable/printed-style PDF)"
    entertainment_screen: "entertainment_video (or gaming_content / non_study_screen, whichever is more specific)"
    social_media_screen: social_media
    shopping_screen: shopping_content
    weak_laptop_only: "not a VisionAnalysis evidence value -- this is a derived condition (screen object present, no study_visual_evidence at all); compute it downstream in Branch F, do not have the model emit it directly"
    uncertain_study_context: uncertain_screen_content
  explicit_prohibitions:
    - "Do not output verified/rejected/retake_required/score/decision."
    - "Do not treat laptop/table/person alone as study evidence."
    - "If a screen is visible but unreadable, prefer uncertain_screen_content over guessing a positive."

study_ocr_recheck:
  applies_to_task: study
  branch: C (requires Branch B document/screen crop first)
  inputs:
    - "YOLO study_document/study_screen crop image (Branch B)"
    - "ocr_text_if_available (raw OCR text from that crop; may be empty/partial/garbled)"
  instruction: >
    OCR already extracted this raw text from the crop (shown verbatim,
    possibly noisy): "{ocr_text_if_available}". Read the crop image yourself
    and use the OCR text only as a hint, not as ground truth. Decide which
    study_visual_evidence values are actually supported by what you can
    read/see, independent of whether the OCR hint agrees. If the OCR text
    contains entertainment-site or non-study keywords, verify against the
    image whether that reflects the actual visible content before reporting
    a blocker.
  output_evidence_field: study_visual_evidence
  positive_evidence_values: [open_textbook, open_workbook, handwritten_notes, problem_solving_material,
                              educational_document, code_editor]
  blocker_evidence_values: [gaming_content, entertainment_video, social_media, shopping_content, non_study_screen]
  explicit_prohibitions:
    - "Do not accept the OCR hint uncritically -- it is error-prone, not evidence by itself."
    - "Do not output verified/rejected/retake_required/score/decision."
    - "OCR-detected keywords (youtube/netflix/game/etc.) are hard-negative guard CANDIDATES -- report the blocker evidence value if the image itself confirms it, and flag the keyword regardless for Branch F's guard step, but do not fabricate a blocker the image doesn't support."

exercise_scene_recheck:
  applies_to_task: exercise
  branch: A (Branch B crop input has near-zero expected value for this task -- see qwen_recovery_branch_design.md Branch B)
  inputs:
    - full_original_image
    - "optional: YOLO exercise_person_or_scene/exercise_equipment crop (Branch B), rarely available for this task"
  instruction: >
    Look at the full image. Identify whether it shows an actual exercise
    activity, environment, or equipment: a gym environment or equipment
    (treadmill/dumbbell/barbell/weight machine/exercise bike/gym bench), a
    running/track environment, a swimming pool/lane, a yoga studio or a
    yoga mat actually laid out, a pilates studio/reformer, or a home-workout
    setup (mat/resistance band/dumbbell/kettlebell/pull-up bar), or a
    genuinely active exercise pose. A visible person alone, sitting/resting,
    a selfie, or exercise clothing with no activity/equipment/environment is
    NOT exercise evidence -- matches image_verification_rule_engine.py's
    `_exercise_mandatory_passed` (never accepts a bare person for any
    activity type). This dataset's exercise task has almost no reliable
    object-detector signal (documented separately) -- rely primarily on your
    own scene/action understanding of the full image.
  output_evidence_field: exercise_visual_evidence
  positive_evidence_values: [gym_environment, treadmill_present, dumbbell_present, barbell_present,
                              weight_machine_present, exercise_bike_present, gym_bench_present,
                              running_track_present, treadmill_running_environment, stadium_track_present,
                              park_running_path_present, swimming_pool_environment, swimming_lane_present,
                              lane_rope_present, swim_cap_present, swim_goggles_present, yoga_mat_present,
                              yoga_studio_present, yoga_pose_visible, pilates_reformer_present,
                              pilates_equipment_present, pilates_studio_present, pilates_pose_visible,
                              exercise_mat_present, resistance_band_present, home_dumbbell_present,
                              kettlebell_present, pull_up_bar_present, home_exercise_pose_visible]
  blocker_evidence_values: [unrelated_environment, wrong_activity_environment, insufficient_exercise_evidence,
                             uncertain_exercise_environment]
  tag_name_corrections:
    gym_environment_visible: gym_environment
    exercise_equipment_visible: exercise_equipment_present
    yoga_mat_laid_out: yoga_mat_present
    pilates_equipment_visible: pilates_equipment_present
    exercise_space_visible: exercise_environment
    person_only: "not a VisionAnalysis evidence value -- derived condition (person label with zero positive exercise_visual_evidence); compute downstream, do not have the model emit it directly"
    resting_or_sitting: insufficient_exercise_evidence
    sofa_or_bedroom_context: unrelated_environment
    selfie_or_clothes_only: insufficient_exercise_evidence
    uncertain_exercise_context: uncertain_exercise_environment
  explicit_prohibitions:
    - "Do not output verified/rejected/retake_required/score/decision."
    - "Do not treat a visible person, exercise clothing, or a selfie pose alone as exercise evidence."
    - "A couch/bed/sofa/resting/sitting scene with no equipment or active pose must be reported toward unrelated_environment or insufficient_exercise_evidence, not a positive value."

expected_output_schema:
  # Shape every prompt above must return -- a subset of the real VisionAnalysis
  # pydantic model (image_verification_schema.py), never the full decision object.
  type: object
  required: [quality, objects, "<task>_visual_evidence"]
  properties:
    quality: {usable: bool, issues: "list[str]"}
    objects: "list[{label: str, confidence: float}] -- must be from that task's allowed_labels only"
    water_visual_evidence: "list[str] -- water prompts only, else []"
    study_visual_evidence: "list[str] -- study prompts only, else []"
    exercise_visual_evidence: "list[str] -- exercise prompts only, else []"
    visible_text: "list[str] -- optional, OCR-adjacent free text if directly read"
